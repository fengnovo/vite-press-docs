<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="520" viewBox="0 0 1050 520">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 25px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .box{fill:#fff;stroke:#334155;stroke-width:2}.net{fill:#ecfeff;stroke:#0891b2;stroke-width:2}.svc{fill:#fdf2f8;stroke:#db2777;stroke-width:2}
      .label{font:700 16px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.small{font:13px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}.code{font:14px Menlo,Consolas,monospace;fill:#334155}
      .line{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1050" height="520"/>
  <text class="title" x="40" y="48">RPC：写起来像调用函数，实际走网络</text>
  <rect class="box" x="70" y="120" width="300" height="110" rx="8"/>
  <text class="label" text-anchor="middle" x="220" y="153">普通本地函数调用</text>
  <text class="code" text-anchor="middle" x="220" y="188">getUserInfo(1)</text>
  <text class="small" text-anchor="middle" x="220" y="212">同一个进程里直接执行</text>
  <rect class="net" x="70" y="330" width="300" height="110" rx="8"/>
  <text class="label" text-anchor="middle" x="220" y="363">BFF 里的 RPC 写法</text>
  <text class="code" text-anchor="middle" x="220" y="398">user.invoke("getUserInfo", [1])</text>
  <text class="small" text-anchor="middle" x="220" y="422">看起来像函数调用</text>
  <rect class="svc" x="680" y="330" width="270" height="110" rx="8"/>
  <text class="label" text-anchor="middle" x="815" y="363">user 服务进程</text>
  <text class="code" text-anchor="middle" x="815" y="398">async getUserInfo(userId)</text>
  <text class="small" text-anchor="middle" x="815" y="422">真正执行在这里</text>
  <path class="line" d="M370 385 H670"/>
  <text class="small" text-anchor="middle" x="520" y="370">网络请求 / 序列化 / 反序列化</text>
</svg>

