<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 26px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .lane{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1}.provider{fill:#fdf2f8;stroke:#db2777;stroke-width:2}
      .consumer{fill:#ecfeff;stroke:#0891b2;stroke-width:2}.registry{fill:#fffbeb;stroke:#d97706;stroke-width:2}
      .db{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}.label{font:700 15px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .small{font:13px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}.laneText{font:700 18px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}
      .line{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}.num{font:700 12px Arial,sans-serif;fill:#fff}
      .badge{fill:#334155}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="720"/>
  <text class="title" x="40" y="46">sofa-rpc-node 注册、发现、调用流程</text>

  <rect class="lane" x="40" y="78" width="520" height="580" rx="12"/>
  <text class="laneText" x="62" y="110">服务提供者：user / post</text>

  <rect class="provider" x="70" y="145" width="190" height="68" rx="8"/>
  <text class="label" text-anchor="middle" x="165" y="174">启动服务进程</text>
  <text class="small" text-anchor="middle" x="165" y="196">user 或 post</text>

  <rect class="provider" x="320" y="145" width="190" height="68" rx="8"/>
  <text class="label" text-anchor="middle" x="415" y="174">创建 RpcServer</text>
  <text class="small" text-anchor="middle" x="415" y="196">10000 / 20000</text>

  <rect class="db" x="70" y="280" width="190" height="68" rx="8"/>
  <text class="label" text-anchor="middle" x="165" y="309">连接 MySQL</text>
  <text class="small" text-anchor="middle" x="165" y="331">database: bff</text>

  <rect class="provider" x="320" y="280" width="190" height="68" rx="8"/>
  <text class="label" text-anchor="middle" x="415" y="309">addService</text>
  <text class="small" text-anchor="middle" x="415" y="331">绑定接口和方法</text>

  <rect class="provider" x="185" y="425" width="210" height="76" rx="8"/>
  <text class="label" text-anchor="middle" x="290" y="455">start + publish</text>
  <text class="small" text-anchor="middle" x="290" y="479">发布服务元信息</text>

  <rect class="registry" x="505" y="520" width="190" height="76" rx="8"/>
  <text class="label" text-anchor="middle" x="600" y="550">Zookeeper</text>
  <text class="small" text-anchor="middle" x="600" y="574">127.0.0.1:2181</text>

  <path class="line" d="M260 179 H310"/>
  <path class="line" d="M415 213 V270"/>
  <path class="line" d="M260 314 H310"/>
  <path class="line" d="M415 348 C420 392,370 420,315 425"/>
  <path class="line" d="M290 501 C330 555,430 560,495 558"/>

  <rect class="lane" x="715" y="78" width="430" height="580" rx="12"/>
  <text class="laneText" x="738" y="110">服务消费者：Koa BFF</text>

  <rect class="consumer" x="760" y="145" width="230" height="68" rx="8"/>
  <text class="label" text-anchor="middle" x="875" y="174">收到 HTTP 请求</text>
  <text class="small" text-anchor="middle" x="875" y="196">进入 rpcMiddleware</text>

  <rect class="consumer" x="760" y="270" width="230" height="78" rx="8"/>
  <text class="label" text-anchor="middle" x="875" y="299">createConsumer</text>
  <text class="small" text-anchor="middle" x="875" y="323">com.keen.user</text>
  <text class="small" text-anchor="middle" x="875" y="341">com.keen.post</text>

  <rect class="consumer" x="760" y="425" width="230" height="76" rx="8"/>
  <text class="label" text-anchor="middle" x="875" y="455">consumer.ready</text>
  <text class="small" text-anchor="middle" x="875" y="479">从注册中心拿地址</text>

  <rect class="consumer" x="760" y="570" width="230" height="68" rx="8"/>
  <text class="label" text-anchor="middle" x="875" y="599">invoke 远程方法</text>
  <text class="small" text-anchor="middle" x="875" y="621">返回查询结果</text>

  <path class="line" d="M875 213 V260"/>
  <path class="line" d="M875 348 V415"/>
  <path class="line" d="M875 501 V560"/>
  <path class="line dash" d="M760 463 C705 470,665 505,620 520"/>
  <text class="small" x="636" y="486">发现服务地址</text>
  <path class="line dash" d="M760 603 C630 660,415 636,323 506"/>
  <text class="small" x="540" y="646">调用 provider</text>

  <rect class="badge" x="76" y="132" width="22" height="22" rx="11"/><text class="num" text-anchor="middle" x="87" y="148">1</text>
  <rect class="badge" x="326" y="132" width="22" height="22" rx="11"/><text class="num" text-anchor="middle" x="337" y="148">2</text>
  <rect class="badge" x="76" y="267" width="22" height="22" rx="11"/><text class="num" text-anchor="middle" x="87" y="283">3</text>
  <rect class="badge" x="326" y="267" width="22" height="22" rx="11"/><text class="num" text-anchor="middle" x="337" y="283">4</text>
  <rect class="badge" x="191" y="412" width="22" height="22" rx="11"/><text class="num" text-anchor="middle" x="202" y="428">5</text>
</svg>

