<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="720" viewBox="0 0 1220 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 25px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .lane{fill:#f1f5f9;stroke:#cbd5e1}.provider{fill:#fdf2f8;stroke:#db2777;stroke-width:2}.consumer{fill:#ecfeff;stroke:#0891b2;stroke-width:2}.zk{fill:#fffbeb;stroke:#d97706;stroke-width:2}
      .label{font:700 15px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.small{font:13px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}.code{font:13px Menlo,Consolas,monospace;fill:#334155}.laneText{font:700 18px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}
      .line{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}
    </style>
  </defs>
  <rect class="bg" width="1220" height="720"/>
  <text class="title" x="40" y="48">sofa-rpc-node：服务端发布，客户端发现并调用</text>
  <rect class="lane" x="45" y="88" width="500" height="570" rx="12"/>
  <text class="laneText" x="70" y="122">服务端 provider：user / post</text>
  <rect class="provider" x="105" y="165" width="360" height="76" rx="8"/>
  <text class="label" text-anchor="middle" x="285" y="194">1. new RpcServer</text>
  <text class="code" text-anchor="middle" x="285" y="218">port: 10000 / 20000</text>
  <rect class="provider" x="105" y="295" width="360" height="86" rx="8"/>
  <text class="label" text-anchor="middle" x="285" y="324">2. server.addService</text>
  <text class="code" text-anchor="middle" x="285" y="348">interfaceName: com.keen.user</text>
  <text class="code" text-anchor="middle" x="285" y="366">method: getUserInfo</text>
  <rect class="provider" x="105" y="455" width="360" height="86" rx="8"/>
  <text class="label" text-anchor="middle" x="285" y="484">3. start + publish</text>
  <text class="small" text-anchor="middle" x="285" y="510">启动本地端口，并把地址写入 Zookeeper</text>
  <path class="line" d="M285 241 V285"/>
  <path class="line" d="M285 381 V445"/>
  <rect class="zk" x="515" y="560" width="190" height="78" rx="8"/>
  <text class="label" text-anchor="middle" x="610" y="592">Zookeeper</text>
  <text class="small" text-anchor="middle" x="610" y="616">保存服务地址</text>
  <path class="line" d="M465 500 C505 530,520 560,505 590"/>
  <rect class="lane" x="735" y="88" width="440" height="570" rx="12"/>
  <text class="laneText" x="760" y="122">客户端 consumer：BFF</text>
  <rect class="consumer" x="795" y="165" width="320" height="76" rx="8"/>
  <text class="label" text-anchor="middle" x="955" y="194">1. new RpcClient</text>
  <text class="small" text-anchor="middle" x="955" y="218">带上 registry</text>
  <rect class="consumer" x="795" y="295" width="320" height="86" rx="8"/>
  <text class="label" text-anchor="middle" x="955" y="324">2. createConsumer</text>
  <text class="code" text-anchor="middle" x="955" y="350">interfaceName: com.keen.user</text>
  <rect class="consumer" x="795" y="455" width="320" height="86" rx="8"/>
  <text class="label" text-anchor="middle" x="955" y="484">3. ready + invoke</text>
  <text class="code" text-anchor="middle" x="955" y="510">invoke("getUserInfo", [1])</text>
  <path class="line" d="M955 241 V285"/>
  <path class="line" d="M955 381 V445"/>
  <path class="line dash" d="M795 500 C720 515,695 555,625 562"/>
  <text class="small" x="680" y="535">ready 时查地址</text>
  <path class="line dash" d="M795 520 C650 675,410 635,315 545"/>
  <text class="small" x="535" y="660">invoke 时调用 provider</text>
</svg>

